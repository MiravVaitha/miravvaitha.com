<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mirav Vaitha — Mobile preview</title>
    <style>
      html, body {
        margin: 0; padding: 0;
        background: #0f1417;
        color: #e6e6e6;
        font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .stage {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 40px 20px 80px;
        gap: 32px;
        background:
          radial-gradient(circle at 20% 20%, rgba(80,120,180,0.18), transparent 60%),
          radial-gradient(circle at 80% 60%, rgba(160,90,180,0.16), transparent 60%),
          #0f1417;
      }
      .header {
        text-align: center;
        max-width: 520px;
      }
      .header h1 {
        font-size: 22px; font-weight: 500; margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      .header p {
        margin: 0; opacity: 0.6; font-size: 13px; line-height: 1.5;
      }
      .header code {
        font-family: ui-monospace, "SF Mono", monospace;
        background: rgba(255,255,255,0.06);
        padding: 1px 6px; border-radius: 4px;
        font-size: 12px;
      }
      .row {
        display: flex; flex-wrap: wrap; justify-content: center;
        gap: 28px;
      }
      .device-shadow {
        filter: drop-shadow(0 30px 80px rgba(0,0,0,0.5));
      }
      iframe {
        border: 0;
        background: #000;
        display: block;
      }
      .toolbar {
        display: flex; gap: 8px; align-items: center;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        padding: 6px 8px;
        border-radius: 999px;
        font-size: 12px;
      }
      .toolbar button {
        background: transparent; color: inherit; border: 0;
        padding: 6px 12px;
        border-radius: 999px;
        font: inherit; cursor: pointer;
      }
      .toolbar button[aria-pressed="true"] {
        background: rgba(255,255,255,0.12);
      }
      .label {
        text-align: center;
        font-family: ui-monospace, "SF Mono", monospace;
        font-size: 11px;
        opacity: 0.5;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      @media (max-width: 900px) {
        .stage { padding: 20px 8px 60px; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="header">
        <h1>Mobile preview</h1>
        <p>
          The portfolio rendered inside an iPhone-sized frame.
          Scroll inside the device to see the full page;
          tap the toolbar to switch sizes.
        </p>
      </div>

      <div class="toolbar" id="size-toolbar" role="group" aria-label="Device size">
        <button data-w="375" data-h="667">iPhone SE</button>
        <button data-w="393" data-h="852" aria-pressed="true">iPhone 15 Pro</button>
        <button data-w="430" data-h="932">iPhone 15 Pro Max</button>
        <button data-w="820" data-h="1180">iPad</button>
      </div>

      <div class="row" id="devices">
        <!-- React device frame renders here -->
        <div id="root"></div>
      </div>
    </div>

    <!-- React + Babel -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script type="text/babel" src="ios-frame.jsx"></script>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function MobilePreview() {
        const [size, setSize] = useState({ w: 393, h: 852 });

        useEffect(() => {
          const onClick = (e) => {
            const btn = e.target.closest("[data-w]");
            if (!btn) return;
            const w = +btn.dataset.w, h = +btn.dataset.h;
            setSize({ w, h });
            document.querySelectorAll("#size-toolbar button").forEach((b) => {
              b.setAttribute("aria-pressed", b === btn ? "true" : "false");
            });
          };
          document.getElementById("size-toolbar").addEventListener("click", onClick);
          return () => document.getElementById("size-toolbar").removeEventListener("click", onClick);
        }, []);

        return (
          <div className="device-shadow">
            <IOSDevice width={size.w} height={size.h} dark={true}>
              <iframe
                src="desktop.html"
                title="Portfolio mobile preview"
                style={{
                  width: "100%",
                  height: "100%",
                  border: 0,
                  display: "block",
                }}
              />
            </IOSDevice>
            <div className="label" style={{ marginTop: 14 }}>
              {size.w} × {size.h}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<MobilePreview />);
    </script>
  </body>
</html>
